<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f6" />
    <meta name="description" content="散场之后，个人影像与创作作品集。" />
    <title>散场之后 · 个人作品集</title>
    <link rel="icon" href="/assets/avatar.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/portfolio.css" />
    <script src="/vendor/lucide.min.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="散场之后，首页">
          <span class="brand-symbol"><i data-lucide="aperture"></i></span>
          <span class="brand-name">散场之后</span>
          <span class="brand-caption">AFTER THE CREDITS</span>
        </a>
        <nav class="desktop-nav" aria-label="主导航">
          <a href="/" data-nav="home">首页</a>
          <a href="/works" data-nav="works">作品集</a>
          <a href="/forum" data-nav="forum">自由论坛</a>
          <a href="/about" data-nav="about">关于我</a>
        </nav>
        <div class="header-actions">
          <button
            class="icon-button"
            id="search-open"
            aria-label="搜索作品"
            title="搜索作品"
          >
            <i data-lucide="search"></i>
          </button>
          <button
            class="icon-button theme-button"
            id="theme-toggle"
            aria-label="切换深色模式"
            title="切换深色模式"
          >
            <i data-lucide="moon"></i>
          </button>
          <span class="header-divider"></span>
          <a class="header-avatar" href="/about" aria-label="关于作者"
            ><img
              src="/assets/avatar.jpg"
              alt="作者头像"
              width="36"
              height="36"
          /></a>
          <button
            class="icon-button menu-button"
            id="menu-toggle"
            aria-label="展开导航"
            aria-expanded="false"
            aria-controls="mobile-nav"
            title="展开导航"
          >
            <i data-lucide="menu"></i>
          </button>
        </div>
      </div>
      <nav class="mobile-nav" id="mobile-nav" aria-label="移动端导航" hidden>
        <a href="/" data-nav="home">首页</a>
        <a href="/works" data-nav="works">作品集</a>
        <a href="/forum" data-nav="forum">自由论坛</a>
        <a href="/about" data-nav="about">关于我</a>
      </nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <div class="footer-inner container">
        <div>
          <a class="footer-brand" href="/"
            >散场之后<span>AFTER THE CREDITS</span></a
          >
          <p>影像与创作，未完待续。</p>
        </div>
        <div class="footer-right">
          <span>© 2026 散场之后</span
          ><button
            class="icon-button"
            id="back-top"
            aria-label="回到顶部"
            title="回到顶部"
          >
            <i data-lucide="arrow-up"></i>
          </button>
        </div>
      </div>
    </footer>
    <dialog
      class="search-dialog"
      id="search-dialog"
      aria-labelledby="search-title"
    >
      <div class="dialog-toolbar">
        <span id="search-title">寻找一件作品</span
        ><button
          class="icon-button"
          data-close="search-dialog"
          aria-label="关闭搜索"
          title="关闭搜索"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="search-field">
        <i data-lucide="search"></i
        ><input
          id="search-input"
          type="search"
          placeholder="搜索作品名称、分类、关键词…"
          autocomplete="off"
          aria-label="搜索作品"
        />
      </div>
      <div id="search-results" class="search-results" aria-live="polite"></div>
    </dialog>
    <dialog
      class="project-dialog"
      id="project-dialog"
      aria-labelledby="project-title"
    >
      <div class="dialog-toolbar sticky-toolbar">
        <span><i data-lucide="clapperboard"></i> 作品详情</span
        ><button
          class="icon-button"
          data-close="project-dialog"
          aria-label="关闭作品详情"
          title="关闭作品详情"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="project-content"></div>
    </dialog>
    <dialog
      class="compose-dialog"
      id="compose-dialog"
      aria-labelledby="compose-title"
    >
      <div class="dialog-toolbar">
        <span id="compose-title">发起一个话题</span
        ><button
          class="icon-button"
          data-close="compose-dialog"
          aria-label="关闭发帖窗口"
          title="关闭发帖窗口"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="compose-form" class="compose-form">
        <div class="form-pair">
          <label
            >昵称 <span>选填</span
            ><input
              name="nickname"
              maxlength="24"
              placeholder="匿名访客"
              autocomplete="nickname" /></label
          ><label
            >分类<select name="category">
              <option>交流</option>
              <option>反馈</option>
              <option>闲聊</option>
            </select></label
          >
        </div>
        <label
          >标题<input
            name="title"
            required
            maxlength="80"
            placeholder="想聊些什么？"
        /></label>
        <label
          >正文<textarea
            name="body"
            required
            maxlength="5000"
            rows="7"
            placeholder="留下一段想法…"
          ></textarea>
        </label>
        <div class="honeypot" aria-hidden="true">
          <input name="website" tabindex="-1" autocomplete="off" />
        </div>
        <p class="form-error" role="alert"></p>
        <div class="form-actions">
          <span class="form-note">不必署名，也可以表达。</span
          ><button class="button" type="submit">
            <i data-lucide="send"></i> 发布话题
          </button>
        </div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
